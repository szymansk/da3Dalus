sonar.projectKey=szymansk_da3Dalus
sonar.organization=szymansk
sonar.sources=app,cad_designer,frontend
sonar.tests=app/tests,cad_designer/tests,frontend/__tests__,frontend/e2e
sonar.test.inclusions=**/test_*.py,**/*_test.py,**/*.test.ts,**/*.test.tsx,**/*.steps.ts
# cad_designer/** is deliberately excluded from analysis: it is fragile,
# read-only geometry/topology code (CadQuery/OCCT). Its latent findings must not
# gate main, and the code must not be "fixed" just to satisfy Sonar.
# Decision: docs/decisions/2026-07-14-exclude-cad-designer-from-sonarcloud.md
sonar.exclusions=frontend/node_modules/**,frontend/.next/**,frontend/.features-gen/**,cad_designer/**
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.version=3.11, 3.12, 3.13
sonar.sourceEncoding=UTF-8