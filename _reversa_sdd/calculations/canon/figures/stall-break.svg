<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="fg-title fg-desc"><title id="fg-title">Stall break on a lift polar</title><desc id="fg-desc">Stall break: past the peak (alpha_S, C_L,max) the lift falls; alpha_break is where it has dropped to (1 - f) C_L,max, found by a forward scan with linear interpolation between samples; the width is alpha_break - alpha_S. Illustrative polar (hand example, not a computed one); f is the canon default.</desc><style>
.fg-t{fill:var(--ink,#23211C);font:12px 'Geist','Helvetica Neue',Arial,sans-serif}
.fg-b{font-weight:600}
.fg-m{fill:var(--ink-2,#6B675E);font:11px 'Geist','Helvetica Neue',Arial,sans-serif}
.fg-h{fill:var(--ink,#23211C);font:600 13px 'Geist','Helvetica Neue',Arial,sans-serif}
.fg-ln{stroke:var(--ink,#23211C);stroke-width:1.4;fill:none}
.fg-thin{stroke:var(--ink-3,#9A958A);stroke-width:1;fill:none}
.fg-dash{stroke-dasharray:5 4}
.fg-wing{fill:var(--inp-bg,#EBF1F7);stroke:var(--inp,#4C7198);stroke-width:1.4}
.fg-gap{fill:var(--hub-bg,#FAF2E4);stroke:var(--hub,#A67C3C);stroke-width:1.2;stroke-dasharray:4 3}
.fg-acc{stroke:var(--sel,#6B4FA0);stroke-width:2;fill:none}
.fg-accf{fill:var(--sel,#6B4FA0)}
.fg-acct{fill:var(--sel,#6B4FA0);font:600 12px 'Geist','Helvetica Neue',Arial,sans-serif}
.fg-bad{stroke:var(--bad,#C0392B);stroke-width:2;fill:none}
.fg-badf{fill:var(--bad,#C0392B)}
.fg-badt{fill:var(--bad,#C0392B);font:600 12px 'Geist','Helvetica Neue',Arial,sans-serif}
.fg-good{stroke:var(--good,#2E8B57);stroke-width:2;fill:none}
.fg-goodf{fill:var(--good,#2E8B57)}
.fg-box{fill:var(--panel,#FFFFFF);stroke:var(--line-2,#CFC9BC);stroke-width:1}
.fg-dot{fill:var(--ink,#23211C)}
</style><line x1="90" y1="300" x2="574" y2="300" class="fg-thin"/><polygon points="580,300 573.5,302.6 573.5,297.4" class="fg-dot"/><line x1="168.33" y1="310" x2="168.33" y2="42" class="fg-thin"/><polygon points="168.33,36 170.93,42.5 165.74,42.5" class="fg-dot"/><text x="580" y="318" class="fg-m" text-anchor="end">alpha (deg)</text><text x="176.33" y="46" class="fg-m" text-anchor="start">C_L</text><polyline points="129.17,300 138.96,292.19 148.75,284.38 158.54,276.56 168.33,268.75 178.12,260.94 187.92,253.12 197.71,245.31 207.5,237.5 217.29,229.69 227.08,221.88 236.88,214.06 246.67,206.25 256.46,198.44 266.25,190.62 276.04,182.81 285.83,175 295.62,167.19 305.42,159.38 315.21,151.56 325,143.75 334.79,135.94 344.58,128.12 354.38,120.31 364.17,112.5 373.96,104.69 383.75,96.88 393.54,89.06 403.33,81.25 413.12,81.72 422.92,83.12 432.71,85.47 442.5,88.75 452.29,92.97 462.08,98.12 471.88,104.22 481.67,111.25 491.46,119.22 501.25,128.12 511.04,137.97 520.83,148.75 530.62,160.47 540.42,173.12 550.21,186.72 560,201.25" class="fg-ln"/><circle cx="129.17" cy="300" r="2" class="fg-dot"/><circle cx="138.96" cy="292.19" r="2" class="fg-dot"/><circle cx="148.75" cy="284.38" r="2" class="fg-dot"/><circle cx="158.54" cy="276.56" r="2" class="fg-dot"/><circle cx="168.33" cy="268.75" r="2" class="fg-dot"/><circle cx="178.12" cy="260.94" r="2" class="fg-dot"/><circle cx="187.92" cy="253.12" r="2" class="fg-dot"/><circle cx="197.71" cy="245.31" r="2" class="fg-dot"/><circle cx="207.5" cy="237.5" r="2" class="fg-dot"/><circle cx="217.29" cy="229.69" r="2" class="fg-dot"/><circle cx="227.08" cy="221.88" r="2" class="fg-dot"/><circle cx="236.88" cy="214.06" r="2" class="fg-dot"/><circle cx="246.67" cy="206.25" r="2" class="fg-dot"/><circle cx="256.46" cy="198.44" r="2" class="fg-dot"/><circle cx="266.25" cy="190.62" r="2" class="fg-dot"/><circle cx="276.04" cy="182.81" r="2" class="fg-dot"/><circle cx="285.83" cy="175" r="2" class="fg-dot"/><circle cx="295.62" cy="167.19" r="2" class="fg-dot"/><circle cx="305.42" cy="159.38" r="2" class="fg-dot"/><circle cx="315.21" cy="151.56" r="2" class="fg-dot"/><circle cx="325" cy="143.75" r="2" class="fg-dot"/><circle cx="334.79" cy="135.94" r="2" class="fg-dot"/><circle cx="344.58" cy="128.12" r="2" class="fg-dot"/><circle cx="354.38" cy="120.31" r="2" class="fg-dot"/><circle cx="364.17" cy="112.5" r="2" class="fg-dot"/><circle cx="373.96" cy="104.69" r="2" class="fg-dot"/><circle cx="383.75" cy="96.88" r="2" class="fg-dot"/><circle cx="393.54" cy="89.06" r="2" class="fg-dot"/><circle cx="403.33" cy="81.25" r="2" class="fg-dot"/><circle cx="413.12" cy="81.72" r="2" class="fg-dot"/><circle cx="422.92" cy="83.12" r="2" class="fg-dot"/><circle cx="432.71" cy="85.47" r="2" class="fg-dot"/><circle cx="442.5" cy="88.75" r="2" class="fg-dot"/><circle cx="452.29" cy="92.97" r="2" class="fg-dot"/><circle cx="462.08" cy="98.12" r="2" class="fg-dot"/><circle cx="471.88" cy="104.22" r="2" class="fg-dot"/><circle cx="481.67" cy="111.25" r="2" class="fg-dot"/><circle cx="491.46" cy="119.22" r="2" class="fg-dot"/><circle cx="501.25" cy="128.12" r="2" class="fg-dot"/><circle cx="511.04" cy="137.97" r="2" class="fg-dot"/><circle cx="520.83" cy="148.75" r="2" class="fg-dot"/><circle cx="530.62" cy="160.47" r="2" class="fg-dot"/><circle cx="540.42" cy="173.12" r="2" class="fg-dot"/><circle cx="550.21" cy="186.72" r="2" class="fg-dot"/><circle cx="560" cy="201.25" r="2" class="fg-dot"/><line x1="90" y1="103.12" x2="560" y2="103.12" class="fg-thin fg-dash"/><text x="94" y="98.12" class="fg-m" text-anchor="start">(1 - f) C_L,max = 1.260</text><circle cx="403.33" cy="81.25" r="5" class="fg-accf"/><text x="395.33" y="71.25" class="fg-acct" text-anchor="end">alpha_S = 12 deg,  C_L,max = 1.40</text><circle cx="470.12" cy="103.12" r="5" class="fg-badf"/><text x="480.12" y="91.12" class="fg-badt" text-anchor="start">alpha_break = 15.41 deg</text><line x1="403.33" y1="328" x2="470.12" y2="328" class="fg-acc"/><polygon points="403.33,328 409.83,325.4 409.83,330.6" class="fg-accf"/><polygon points="470.12,328 463.62,330.6 463.62,325.4" class="fg-accf"/><text x="436.73" y="344" class="fg-acct" text-anchor="middle">width = 3.41 deg</text><line x1="403.33" y1="300" x2="403.33" y2="334" class="fg-thin fg-dash"/><line x1="470.12" y1="300" x2="470.12" y2="334" class="fg-thin fg-dash"/><text x="660" y="90" class="fg-h" text-anchor="start">f = 0.1</text><text x="660" y="112" class="fg-m" text-anchor="start">the canon's cut, a convention</text><text x="660" y="150" class="fg-t" text-anchor="start">Not C_L,max itself:</text><text x="660" y="168" class="fg-t" text-anchor="start">the break is where the lift</text><text x="660" y="186" class="fg-t" text-anchor="start">has visibly fallen.</text><text x="660" y="224" class="fg-m" text-anchor="start">Samples every 0.5 deg; the</text><text x="660" y="240" class="fg-m" text-anchor="start">crossing is interpolated.</text></svg>
