<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="fg-title fg-desc"><title id="fg-title">Spanwise lift, shear force and bending moment</title><desc id="fg-desc">Spanwise loads of one half-wing, y from the centreline outward: l(y) is the lift per metre, V(y) its integral from the tip to y, M(y) the integral of V. Elliptic l(y) as a hand example (the kernel takes l(y) from one AVL solution); L = n m g with n = 1, m = 1.5 kg.</desc><style>
