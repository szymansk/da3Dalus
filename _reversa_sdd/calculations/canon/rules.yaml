# Validation rules of the calculation canon (#1260, maintainer 2026-10-25).
# <rule-id>:
#   applies_to  {quantity: <input quantity>} | {formula: <formula>}   what the rule guards
#   kind        input   a requirement on the input data (the kernel refuses the input)
#               tool    a stated limit of a tool (the kernel refuses what the tool cannot do)
#               probe   the agreement tolerance of a probe with the value it checks
#   on_violation  error | warning
#   criterion   the rule in words; a threshold is named by its parameter
#   codes       the error codes the kernel reports for a violation (traced into the code by a test)
#   parameters  <name>: {value, unit, basis, status, source, regime}
#                 basis   definition | standard | sourced | convention (a chosen value adopted on
#                         the maintainer's word)
#                 status  adopted | pending (a proposal; the kernel never reads a pending value)
#                 The caller may override an adopted value (AircraftInput.rule_overrides, key
#                 "<rule-id>.<name>"); an override is declared in the provenance (ADR 0020).
# No threshold of a validation rule stands as a literal in the kernel (maintainer, 2026-10-25:
# "Ich mag keine Magic Numbers im Code!"). Value bounds of a supplied quantity are not rules
# here: they are the quantity fields positive and at_most.

finite-numbers:
  applies_to: {quantity: airplane}
  kind: input
  on_violation: error
  criterion: "Every number of the geometry that the kernel reads is finite (no NaN, no infinity)."
  codes: [non_finite_number]

positive-lengths:
  applies_to: {quantity: airplane}
  kind: input
  on_violation: error
  criterion: "Every chord, every fuselage semi-axis (zero allowed at an end section) and every fuselage shape exponent is greater than zero, and the leading-edge chain of a wing has a length greater than zero."
  codes: [non_positive_length]

distinct-sections:
  applies_to: {quantity: airplane}
  kind: input
  on_violation: error
  criterion: "Two adjacent sections of a wing do not sit at one spanwise station (the same y and z of the leading edge): the section between them would have no span, which AeroSandbox's AeroBuildup turns into NaN (maintainer 2026-11-01, #1342). Near-duplicates are export hygiene of the digitisation plugin, not refused here."
  codes: [duplicate_section]

minimum-sections:
  applies_to: {quantity: airplane}
  kind: input
  on_violation: error
  criterion: "A wing and a fuselage have at least min_sections sections: a surface needs a root and a tip."
  codes: [too_few_sections]
  parameters:
    min_sections:
      value: 2
      unit: "1"
      basis: definition
      status: adopted
      source: "a lofted surface is defined by at least two sections"
      regime: "regime-independent"

airfoil-resolvable:
  applies_to: {quantity: airplane}
  kind: input
  on_violation: error
  criterion: "An airfoil is a NACA 4-digit designation or inline coordinates (the kernel loads no files); a contour has at least min_contour_points points and starts and ends at the trailing edge, the largest x (Selig order)."
  codes: [unresolved_airfoil, invalid_airfoil_contour]
  parameters:
    min_contour_points:
      value: 3
      unit: "1"
      basis: definition
      status: adopted
      source: "three points are the least that enclose an area; the first and last point being the trailing edge makes the order Selig"
      regime: "regime-independent"

airfoil-positive-thickness:
  applies_to: {quantity: airplane}
  kind: input
  on_violation: error
  criterion: "An airfoil has a maximum thickness greater than zero: a NACA designation with a thickness above 00, a contour whose upper surface lies above its lower surface somewhere."
  codes: [non_positive_thickness]

fuselage-contour:
  applies_to: {quantity: airplane}
  kind: input
  on_violation: error
  criterion: "A fuselage section's optional contour is its full outline as a closed loop, (y, z) in metres relative to the section centre xyz (format 7.1b, #1349); the segment from the last point back to the first is implicit, the first point is not repeated, the start point is the writer's choice, and nothing is assumed about symmetry (asymmetric and concave formers are valid). It has at least min_contour_points points, no repeated consecutive point (also last to first), no two segments that cross or touch other than at a shared vertex (a simple polygon, the closing segment included), and a positive signed area: counter-clockwise with y to the right and z up. If any section of a fuselage has a contour, every section has one with the same number of points (the loft joins point i to point i). Only the first and the last section may carry a degenerate contour of that count, which closes the body: a point (all points identical) or a line (all points exactly collinear, e.g. a vertical trailing edge); the simple-polygon and orientation rules do not apply to it, and a degenerate contour at an interior section is refused. No solver reads the contour and it is not compared with the fit a, b, n, n_lower: the solvers keep the fit (ADR 0022), and a deviation is expected, which is why the contour exists (maintainer 2026-11-03 and 2026-11-04, #1349)."
  codes: [invalid_fuselage_contour, inconsistent_fuselage_contours]
  parameters:
    min_contour_points:
      value: 3
      unit: "1"
      basis: definition
      status: adopted
      source: "the geometric minimum of a polygon: three points are the least that enclose an area (maintainer 2026-11-04, #1349; replaces the 8 points of the issue proposal)"
      regime: "regime-independent: a statement about the geometry document, not about the flow"

body-attachment:
  applies_to: {quantity: airplane}
  kind: input
  on_violation: error
  criterion: "Every body under fuselages has a role (fuselage, canopy, nacelle, fairing, pod or other; fuselage when the document does not say), stated by the writer and never inferred from its name, and optionally attached_to, the name of the body it sits on (#1355, maintainer 2026-11-05). attached_to, when set, names another body of the same aircraft, and the chain of attached_to has no cycle. A body of role canopy has attached_to. A canopy's x range, from the smallest to the largest xyz[0] of its sections, lies within its parent's x range, ends included and without tolerance; the ranges are compared only when both bodies have at least minimum-sections.min_sections sections with finite positions (a body with fewer is refused by too_few_sections, a non-finite position by finite-numbers). Nothing else is checked: neither whether a canopy's contour describes only its visible part, nor whether several bodies on the symmetry plane lack symmetric. No solver reads the role or attached_to: the drag of a canopy is computed for the whole body (#1355 slice 2, pending a decision)."
  codes: [invalid_body_attachment, canopy_outside_parent]

segment-details-not-on-last-section:
  applies_to: {quantity: airplane}
  kind: input
  on_violation: error
  criterion: "The last section of a wing carries no trailing-edge device, spar list or turbulator: it ends the wing and has no segment outboard of it."
  codes: [segment_on_last_section]

control-surface-needs-device:
  applies_to: {quantity: airplane}
  kind: input
  on_violation: error
  criterion: "A control surface is given only on a section that has a trailing-edge device: the kernel takes role and hinge from the device."
  codes: [control_surface_without_device]

surface-type-required:
  applies_to: {quantity: airplane}
  kind: input
  on_violation: error
  criterion: "Every wing has a surface_type; the kernel never infers one from the planform (D9)."
  codes: [missing_surface_type]

one-main-wing:
  applies_to: {quantity: airplane}
  kind: input
  on_violation: error
  criterion: "The airplane has exactly required_main_wings wings of surface_type main_wing: its area, span and chord are the reference values."
  codes: [main_wing_count]
  parameters:
    required_main_wings:
      value: 1
      unit: "1"
      basis: definition
      status: adopted
      source: "one reference wing per airplane; biplanes are out of v1 (ARCHITECTURE 8.5)"
      regime: "regime-independent"

main-wing-spanwise-extent:
  applies_to: {quantity: airplane}
  kind: input
  on_violation: error
  criterion: "A wing of surface_type main_wing is inclined from the horizontal by less than max_inclination over its stored sections: arctan((max z - min z) / (max y - min y)) < max_inclination; a wing with no y-extent is a vertical surface and is refused. AeroSandbox would measure a vertical surface without complaint (a slant planform)."
  codes: [main_wing_without_spanwise_extent]
  parameters:
    max_inclination:
      value: 45
      unit: deg
      basis: convention
      status: adopted
      source: "adopted by the maintainer on 2026-10-25 (#1253); no published source. The dihedral of a real main wing stays far below it, even a strong V (10-15 deg), while a fin or a V-tail typed main_wing has y-extent <= z-extent"
      regime: "regime-independent: a statement about the shape of the surface, not about the flow"

sections-monotone-in-y:
  applies_to: {quantity: airplane}
  kind: input
  on_violation: error
  criterion: "The sections of a mirrored surface run from the root outwards without doubling back in y (a fin: in z): a planform that doubles back would be counted twice."
  codes: [unsupported_configuration]

neutral-point-layout:
  applies_to: {formula: neutral-point}
  kind: input
  on_violation: error
  criterion: "The neutral point is defined for one main wing with one pitch surface, a horizontal tail or a V-tail (any fins and winglets); a tailless wing, a canard, a tandem wing and a layout with more than one pitch surface are refused (#1206, #1207)."
  codes: [unsupported_layout]

flap-deflection-with-flaps:
  applies_to: {formula: airplane-configuration}
  kind: input
  on_violation: error
  criterion: "An airplane that has flaps is given the flap deflection of the configuration; the kernel takes no default."
  codes: [missing_input]

roll-device-on-mirrored-surface:
  applies_to: {formula: roll-rate}
  kind: input
  on_violation: error
  criterion: "A roll device (aileron, flaperon, elevon) sits on a mirrored surface and has a hinge position (rel_chord_root); the tool's default hinge is never used."
  codes: [roll_device_on_unmirrored_surface, missing_hinge]

avl-no-deflected-device:
  applies_to: {formula: neutral-point}
  kind: tool
  on_violation: error
  criterion: "AVL runs the clean airplane: the kernel writes no CONTROL, so a deflected control device is refused rather than computed as the clean airplane."
  codes: [unsupported_configuration]

aerobuildup-no-deflected-device:
  applies_to: {formula: stall-speed}
  kind: tool
  on_violation: error
  criterion: "AeroBuildup is given the flaps of a configuration as deflected contours (#1212; the stall-speed applications takeoff and landing) and the roll command as an aileron surface; any other deflected control device is refused rather than computed as the clean airplane."
  codes: [unsupported_configuration]

flap-model-validity:
  applies_to: {formula: stall-speed}
  kind: tool
  on_violation: warning
  criterion: "A flap is the rotated contour behind its hinge, evaluated by NeuralFoil (a plain, single-element flap; maintainer 2026-10-26, #1212). The result of stall-speed (take-off and landing applications) and of roll-rate (approach) is declared outside the model's trusted range when, for a deflected device (each deflected flap, and the driven aileron of a roll), the area-weighted mean of NeuralFoil's analysis_confidence over the sections the device spans at the solution is below min_confidence (flap_confidence_low, one per device, with the share of the device span below it and the lowest section; maintainer 2026-11-01, #1342), and when a flap deflection is above max_flap_deflection (flap_deflection_beyond_validity). The value is computed and returned with the declaration, never withheld."
  codes: [flap_confidence_low, flap_deflection_beyond_validity]
  parameters:
    min_confidence:
      value: 0.85
      unit: "1"
      basis: convention
      status: adopted
      source: "the app's existing low-confidence flag for NeuralFoil polars, app/settings.py low_re_low_confidence_flag = 0.85 ('Low analysis confidence - validate with XFoil'); one threshold for one concept; adopted by the maintainer 2026-10-26, #1212. The kernel must not import app/ (E8), so the value is stated twice: a later change of either must change both. Measured on RV-7 (NACA 23013.5, Re 1e5, hinge 0.75): flap 15 deg gives confidence of at least 0.93 at the section, 30 deg 0.35 to 0.8"
      regime: "RC/UAV: measured at chord Reynolds numbers 1e5 and 3e5, inside the band of ADR 0028"
    max_flap_deflection:
      value: 30.0
      unit: deg
      basis: convention
      status: adopted
      source: "plain-flap separation above about 40 deg (Scholz ch. 8 / Sadraey 5.12.2), earlier at low Re; 30 deg keeps a margin; adopted by the maintainer 2026-10-26, #1212"
      regime: "transport and general-aviation material for the separation angle, not checked at model Reynolds number (ADR 0028); the adopted value is deliberately below it"

avl-mesh-layout:
  applies_to: {formula: roll-rate}
  kind: tool
  on_violation: error
  criterion: "The AVL mesh drives the roll devices of the main wing only: a roll device on another surface (unsupported_layout) is refused. The continuity of the hinge line is the rule hinge-line-continuity."
  codes: [unsupported_layout]

hinge-line-continuity:
  applies_to: {formula: roll-rate}
  kind: input
  on_violation: error
  criterion: "Two driven segments of a roll device that meet at a rib (their positions in y closer than join_tolerance) have the same hinge position there: AVL holds one hinge position per section. The same distance decides that a station of a device end and the rib it was read from are one rib."
  codes: [hinge_line_discontinuous]
  parameters:
    join_tolerance:
      value: 1.0e-8
      unit: m
      basis: convention
      status: adopted
      source: "a numerical identity of two positions of one rib; no published source (maintainer 2026-10-26, #1299: a domain limit that stays an overridable rule parameter)"
      regime: "regime-independent: a statement about the geometry document, not about the flow"

avl-roll-rate-validity:
  applies_to: {formula: roll-rate}
  kind: tool
  on_violation: warning
  criterion: "AVL is linear in the deflection: the AVL world of the roll rate is used while |p b / 2V| is at most max_roll_rate_coefficient; beyond it the world is declared outside its validity and dropped from the interval (A11)."
  codes: [avl_roll_rate_beyond_range, world_outside_validity]
  parameters:
    max_roll_rate_coefficient:
      value: 0.10
      unit: "1"
      basis: sourced
      status: adopted
      source: "AVL primer (Avl/avl_doc.txt:121-141): -0.10 < pb/2V < 0.10 is the practical limit for roll rates, beyond which results should be interpreted with caution; adopted for the AVL world by the maintainer on #1243, 2026-10-25"
      regime: "RC/UAV: model roll rates stay inside the primer's range at approach speed (BRYAN 0.29, JAGUAR 0.28 at 20 deg are beyond it, which is why the AVL world is dropped there); the limit is a property of AVL's linearisation, not of the flow regime"

avl-array-limit:
  applies_to: {formula: neutral-point}
  kind: tool
  on_violation: error
  criterion: "AVL's vortex array has a fixed size; a mesh that overflows it is refused (avl_array_limit) and a refined check that overflows is declared, never silently dropped."
  codes: [avl_array_limit]

aerosandbox-fuselage-shape:
  applies_to: {quantity: airplane}
  kind: tool
  on_violation: error
  criterion: "AeroSandbox has no mirrored body: a mirrored fuselage is refused rather than approximated. It has one shape exponent per fuselage section: a section with n_lower different from n is not refused but mapped to the equivalent symmetric section of the same width, height and centre and equal cross-section area, declared per section as the notice fuselage_section_equivalent (#1307, ADR 0020)."
  codes: [unsupported_configuration]

isa-altitude-range:
  applies_to: {formula: air-density-isa}
  kind: tool
  on_violation: error
  criterion: "The altitude lies inside the range of AeroSandbox's International Standard Atmosphere (the range is the tool's own, read from it)."
  codes: [invalid_input]

reynolds-mach-regime:
  applies_to: {formula: aerobuildup-evaluation}
  kind: tool
  on_violation: warning
  criterion: "The RC/UAV regime of ADR 0028, checked by the AeroBuildup adapter on every evaluation (amended 2026-11-01, #1342). The chord Reynolds number is evaluated at every station and aggregated: per surface at its mean aerodynamic chord (below re_band_min reynolds_outside_band, below re_bubble_max reynolds_bubble_sensitive, above re_band_max reynolds_above_band), and per control device when a station of its span lies below re_band_min (reynolds_outside_band_at_device). The Mach number once: above mach_limit mach_above_limit, above mach_validity mach_beyond_validity. The value is always computed and returned with the declaration."
  codes: [reynolds_outside_band, reynolds_bubble_sensitive, reynolds_above_band, reynolds_outside_band_at_device, mach_above_limit, mach_beyond_validity]
  parameters:
    re_band_min:
      value: 30000.0
      unit: "1"
      basis: sourced
      status: adopted
      source: "ADR 0028 (maintainer 2026-10-14): Lissaman, Low-Reynolds-Number Airfoils, Ann. Rev. Fluid Mech. 15 (1983) p. 227-228: below about 3e4 separation can involve the whole trailing edge; the band edge itself is marked uncited practice in the ADR"
      regime: "defines the RC/UAV regime (ADR 0028): the lower end of the core chord Reynolds band"
    re_bubble_max:
      value: 70000.0
      unit: "1"
      basis: sourced
      status: adopted
      source: "ADR 0028: Lissaman 1983 p. 228, critical Re about 70 000 (a laminar bubble needs about Re 50 000 of run to reattach); Sharpe 2024 PhD thesis 7.2.4, NeuralFoil's analysis confidence drops near Re 80 000"
      regime: "defines the RC/UAV regime (ADR 0028): the bubble-sensitive part of the core band"
    re_band_max:
      value: 1000000.0
      unit: "1"
      basis: sourced
      status: adopted
      source: "ADR 0028: Lissaman 1983 p. 228, 'low Re' is 1e4 to 1e6; above it the tools stay valid (NeuralFoil trained to Re about 2.6e8, Sharpe 2024 7.2.5), a notice only"
      regime: "defines the RC/UAV regime (ADR 0028): the upper end of the core band"
    mach_limit:
      value: 0.3
      unit: "1"
      basis: sourced
      status: adopted
      source: "ADR 0028: Anderson, Fundamentals of Aerodynamics 6e, 8.5: below Mach 0.3 the density changes by less than 5 %, the flow is incompressible"
      regime: "regime-independent (a statement about compressibility); the RC/UAV regime lies far below it"
    mach_validity:
      value: 0.6
      unit: "1"
      basis: sourced
      status: adopted
      source: "ADR 0028: AVL documentation, Prandtl-Glauert 'expected valid' to about Mach 0.6; NeuralFoil's Laitone correction; above it a value is not physically meaningful (error, amended 2026-11-01, #1342)"
      regime: "regime-independent (a statement about compressibility); the RC/UAV regime lies far below it"

aerobuildup-induced-drag:
  applies_to: {formula: aerobuildup-evaluation}
  kind: tool
  on_violation: warning
  criterion: "AeroBuildup's induced drag uses the Nita-Scholz Oswald factor, which multiplies the inviscid (geometric) factor by the empirical viscous factor k_e_d0 (aerosandbox/library/aerodynamics/inviscid.py:67-74, 81); that factor folds the lift-dependent profile drag into e, and NeuralFoil's section polars, which AeroBuildup integrates at each local Reynolds number, already contain that drag: AeroBuildup counts it twice. Wherever the kernel takes drag from AeroBuildup (the single evaluation, the alpha sweep, the model function of the IPOPT problems) it therefore uses D = D_profile + k_e_d0 * D_induced and C_D = D / (q S_ref), with D_profile and D_induced as AeroBuildup returns them (aero_buildup.py:344-345); the softmax that combines the components' effective spans (aero_buildup.py:279-290) is homogeneous of degree 1, and every wing's e carries k_e_d0, so this equals AeroBuildup with k_e_d0 = 1 while the wings dominate the softmax; a fuselage's own e = 0.95 (aero_buildup.py:1221) carries no k_e_d0, so where the fuselage term counts the equality is not exact (measured on four fleet aircraft: ratio 0.836250, #1346; the aero tier compares the two on BRYAN and BELEMNITOS). The parameter is greater than zero and at most 1 (1 removes nothing); an override outside that is refused. AeroSandbox is not patched. Every value that carries the correction is declared by the notice induced_drag_viscous_factor_removed (one per evaluation), with k_e_d0 and the share of AeroBuildup's induced drag removed (1 - k_e_d0) in its detail (maintainer 2026-11-03, #1346, path B)."
  codes: [induced_drag_viscous_factor_removed]
  parameters:
    k_e_d0:
      value: 0.83625
      unit: "1"
      basis: sourced
      status: adopted
      positive: true
      at_most: 1.0
      source: "Nita & Scholz (2012), Estimating the Oswald Factor from Basic Aircraft Geometrical Parameters, section 5: the class values of the viscous factor k_e,D0 (jet transport 0.873, business jet 0.864, turboprop 0.804, general aviation 0.804), as transcribed in AeroSandbox 4.2.9 aerosandbox/library/aerodynamics/inviscid.py:67-74, which uses their mean 0.83625; the paper itself is not in the vault (open gap, #1346). Anderson, Fundamentals of Aerodynamics 6e, 6.7.2: the Oswald factor of the complete-airplane polar absorbs the lift-dependent part of the parasite drag; 5.3.3: where the profile drag comes from a section polar, the inviscid span efficiency factor is the right one. Removal decided by the maintainer 2026-11-03, #1346 (path B). The aero tier checks that this value equals AeroSandbox's (oswalds_efficiency over its e_theo)"
      regime: "not an RC/UAV value: the four classes are full-scale aircraft (ADR 0028), which is why the kernel removes the factor instead of applying it; the value is AeroSandbox's, so that the removal is exact. Measured on BRYAN, WIESEL, CHEKKER and BELEMNITOS (#1346): AeroBuildup's induced drag against AVL Trefftz at C_L 0.9 is +24 to +28 % with the factor and +3.7 to +6.9 % without it; NeuralFoil's lift-dependent profile drag is 0.3 to 1.3 times the term the factor adds"

static-margin-probe-agreement:
  applies_to: {formula: static-margin-probe}
  kind: probe
  on_violation: warning
  criterion: "The static margin from the moment slope (the probe) agrees with the target static margin to within agreement_tolerance, in fractions of the mean aerodynamic chord; the tolerance decides first: inside it nothing is reported, even where the signs differ; a larger deviation is reported, never averaged: as static_margin_probe_sign_disagrees (error) when probe and target differ in sign, else as static_margin_probe_disagrees (warning) (maintainer 2026-11-02, #1342)."
  codes: [static_margin_probe_disagrees, static_margin_probe_sign_disagrees]
  parameters:
    agreement_tolerance:
      value: 0.05
      unit: "1"
      basis: convention
      status: adopted
      source: "maintainer 2026-10-25: 5 % MAC. Reasoning: the neutral-point worlds spread 3-6 % MAC (textbook against AVL, BRYAN and JAGUAR), plus the declared probe bias (AeroBuildup has no wing-tail downwash)"
      regime: "regime-independent as a statement about agreement; the value rests on the spread of the methods in the RC/UAV regime"
