# Defaults of the calculation canon (#1174, maintainer 2026-10-17).
# <slug>: {value, unit, basis, source, regime}
#   value  — in the quantity's canon unit
#   basis  — what kind of value it is (README, "Machine-readable fields"):
#              definition  true by definition of the quantity
#              standard    a published standard value (ISA, standard gravity)
#              sourced     taken from a cited source
#              convention  a chosen value with no published source, adopted on the maintainer's
#                          word; the navigator marks every calculation that rests on one
#   source — the citation
#   regime — ADR 0028: why the value holds for RC/UAV (chord Re 3e4–1e6, Mach <= 0.3, no wheel
#            brakes), or "regime-independent"
# Values moved from the quantity entries; touchdown changed to 1.1 (maintainer, 2026-10-17).

altitude:
  value: 0
  unit: "m"
  basis: convention
  source: "maintainer 2026-10-25: without a stated altitude the atmosphere is evaluated at the ISA reference, mean sea level (U.S. Standard Atmosphere 1976); the designer overrides it, e.g. for a field at 500 m"
  regime: "regime-independent"

approach-speed-margin-target:
  value: 1.3
  unit: "1"
  basis: sourced
  source: "Lennon, Basics of R/C Model Aircraft Design, Ch. 20 (FAR 23 reasoning, scaled); CS 25.125 as transport-category reference"
  regime: "transport rule taken as the lower bound: at low wing loading and low speed a gust changes the angle of attack and load factor more (Scholz Wing Design §7.3), so RC needs at least this margin; a larger RC margin has no source"

cell-voltage-nominal:
  value: 3.7
  unit: "V"
  basis: sourced
  source: "SkyRC, \"RC Battery Lineup: Voltage Ranges by Chemistry Types\", SkyRC Blog, 2024-12-26 (https://blog.skyrc.com/rc-battery-lineup-voltage-ranges-by-chemistry-types/): nominal per cell LiPo 3.7 V (LiHV 3.8 V, LiFe 3.2 V, Li-Ion 3.6 V, NiMH 1.2 V); the default is the LiPo value"
  regime: "regime-independent: a property of the cell chemistry, not of the flow; a mid-discharge value, so the rated mAh times it is the energy at the manufacturer's test rate; the caller overrides it for another chemistry"

gravity:
  value: 9.80665
  unit: "m/s^2"
  basis: standard
  source: "standard gravity, CGPM 1901 / U.S. Standard Atmosphere 1976"
  regime: "regime-independent"

load-factor:
  value: 1
  unit: "1"
  basis: definition
  source: "definition of the load factor n = L/W (as stated in max-mass-structure); straight level flight means L = W"
  regime: "regime-independent"

motor-efficiency:
  value: 0.75
  unit: "1"
  basis: sourced
  source: "Roxxy Motoren-Fibel, Ch. 3: efficiency band 75–85 %; the lower bound, because route A applies it at P_max, above the peak-efficiency point"
  regime: "RC brushless motors (the source's subject); at P_max copper loss grows with I², so the efficiency lies below the peak band and the lower bound fits"

sea-level-air-density:
  value: 1.225
  unit: "kg/m^3"
  basis: standard
  source: "U.S. Standard Atmosphere 1976 (NOAA-S/T 76-1562), sea-level density; cited in formulas/air-density-isa"
  regime: "regime-independent (a high or hot field lies below it; field density stays an input)"

takeoff-speed-margin-target:
  value: 1.1
  unit: "1"
  basis: sourced
  source: "Sadraey, Aircraft Design (2013), §4.3.4: V_TO = 1.1–1.3 V_s (lower edge)"
  regime: "rise-off-ground without wheel brakes has no decision-speed logic; Sadraey's ground roll rotates at about 1.1 V_s (§4.3.4.2 Eq. 4.76); hand launch: no source"

touchdown-speed-margin-target:
  value: 1.1
  unit: "1"
  basis: sourced
  source: "Sadraey, Aircraft Design (2013), §4.3.2: take-off and landing speeds are typically 1.1–1.3 V_s; §9.3.10: flare to minimum speed"
  regime: "RC models flare to near V_min and have no wheel brakes, so the low end of the band applies; the old 1.2 (Lennon) is a landing speed with a safety margin, which approach 1.3 covers. Maintainer decision 2026-10-17"

stall-break-fraction:
  value: 0.10
  unit: "1"
  basis: convention
  source: "maintainer decision 2026-10-24 (#1219); no published value (Anderson, Sadraey, Lennon describe the stall break qualitatively and quantify it nowhere)"
  regime: "a measurement convention on the computed polar, not a flight regime: clearly above solver noise (a 1-3 % drop can be one non-monotone sample) and close enough to the peak that the 360 deg blend of the polar does not dominate; applies at the stall Reynolds number of the polar"

tail-efficiency:
  value: 0.65
  unit: "1"
  basis: sourced
  source: "Lennon, Basics of R/C Model Aircraft Design (1996) Ch. 7/8: conventional tail near the wing wake 0.65 (T-tail 0.9, in the wake 0.4); Sadraey, Aircraft Design (2013) Eq. 6.28 §6.2.1: 0.85–0.95 conventional, 1 T-tail, full-scale; maintainer decision 2026-10-24 (#1205); basis sourced (Lennon gives the value), maintainer 2026-10-25"
  regime: "not checked at RC Reynolds number: the wing wake is thicker at low Re, by an amount no source quantifies; Lennon's model-scale value is used instead of the full-scale 0.85–0.95. The designer overrides it per airplane"

battery-specific-energy:
  value: 140
  unit: "Wh/kg"
  basis: convention
  source: "maintainer, 2026-10-25 (#1235): pack level, a round value inside 128–159 Wh/kg; that band comes from the catalogue's ten 'Generic LiPo' entries, which are placeholder data, not manufacturer datasheets — no published pack value is cited yet"
  regime: "RC LiPo packs, pack level (wiring, balance lead, shrink included); the cell-level figure of the cited RC-Network value (152.8 Wh/kg) is higher by construction"

limit-load-factor:
  value: 10
  unit: "1"
  basis: convention
  source: "maintainer, 2026-10-25 (canon review of maneuvering-speed): 10 g instead of the former 3; measured loads on models are 6–19 g (spar sizing); to be replaced by a mission table with its structure-mass consequence (#1242)"
  regime: "RC/UAV models: far above the transport and FAR 23 values (2.5–6 g), inside the measured 6–19 g; the designer overrides it per airplane"
