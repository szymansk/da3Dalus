  /airfoils/db/suitability:
    get:
      tags:
      - airfoil-catalog
      operationId: get_airfoil_suitability
      summary: Rank DB airfoils by low-Re suitability at the given chord/speed
      parameters:
      - name: chord_m
        in: query
        required: true
        schema:
          type: number
        description: Root chord in metres (used to compute Re).
      - name: speed_ms
        in: query
        required: true
        schema:
          type: number
        description: Airspeed in m/s (used to compute Re).
      - name: aeroplane_id
        in: query
        required: false
        schema:
          type: string
        description: UUID4 of the aeroplane (aeroplanes.uuid). Resolves mission preset + operating CLs.
      - name: mission_type
        in: query
        required: false
        schema:
          type: string
        description: 'Explicit mission type override: trainer|sport|aerobatic|glider|flying_wing.'
      - name: target_cl_cruise
        in: query
        required: false
        schema:
          type: number
        description: Explicit target CL at cruise (overrides aeroplane-derived value).
      - name: target_cl_best_glide
        in: query
        required: false
        schema:
          type: number
        description: Explicit target CL at best-glide speed (V_md). Display-only — does not drive active_lens.
          Overrides aeroplane-derived value from v_md_mps context.
      - name: target_cl_min_sink
        in: query
        required: false
        schema:
          type: number
        description: Explicit target CL at min-sink speed (V_min_sink). Display-only — does not drive
          active_lens. Renamed from target_cl_loiter (gh-825).
      - name: tip_chord_m
        in: query
        required: false
        schema:
          type: number
        description: Tip chord in metres — only used to compute tip Re and set tip_re_flag.
      - name: include
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated airfoil names to always score+return even if outside top-N. Additive;
          old clients (no include) get identical behaviour to before. Names with no low-Re polar rows
          are NOT fabricated. Example: ?include=s1223,ag35'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
        description: Maximum number of results to return.
      - name: family
        in: query
        required: false
        schema:
          type: string
        description: 'gh-835: Comma-separated family filter. Valid values: flat_bottom, semi_symmetric,
          symmetric, cambered, reflexed. OR logic within this dimension. Example: ?family=reflexed,cambered'
      - name: tags
        in: query
        required: false
        schema:
          type: string
        description: 'gh-835: Comma-separated role-tag filter. Valid values: v_stabilizer, h_stabilizer,
          acro, winglet, low_re, high_re. OR logic: any single matching tag is sufficient. Example: ?tags=acro,winglet'
      - name: thickness_min_pct
        in: query
        required: false
        schema:
          type: number
        description: 'gh-835: Lower bound on max_thickness_pct (inclusive, % of chord). Combined AND with
          other filter dimensions.'
      - name: thickness_max_pct
        in: query
        required: false
        schema:
          type: number
        description: 'gh-835: Upper bound on max_thickness_pct (inclusive, % of chord). Combined AND with
          other filter dimensions.'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuitabilityResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Entity not found (`code: not_found`).'
        '422':
          description: 'Validation failed (`code: validation_error`), or FastAPI request validation.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/HTTPValidationError'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AeroSandbox is unavailable on this platform (`Depends(require_aerosandbox)`, ADR
            0017).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Internal error (`code: internal_error` / `service_error`).'
