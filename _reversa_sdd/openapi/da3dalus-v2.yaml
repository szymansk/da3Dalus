# Generated by the Reversa Writer from the verified route inventory.
# Source of truth: AST walk of app/api/v2/endpoints/ (230 route decorators).
openapi: 3.1.0
info:
  title: da3Dalus Model Context Protocol (v2)
  version: 2.0.0
  summary: Parametric aircraft design, aerodynamic analysis and CAD generation for RC and UAV aircraft.
  description: |
    Reverse-engineered OpenAPI 3.1 description of the **da3Dalus** backend v2 REST surface,
    produced by the Reversa Writer from the module `contracts.md` files and verified against the
    source tree by AST-walking every route decorator under `app/api/v2/endpoints/`.

    ## Coverage

    **All 230 route decorators present in the code are described here — none is omitted.**
    The route count was verified two ways: an AST walk of the endpoint tree and
    `.reversa/context/surface.json` (`api_surface.rest_route_count = 230`) agree exactly.

    Where compression was applied, it is in **schema depth, never in endpoint coverage**:

    - Handlers that declare a FastAPI `response_model` are typed against a matching
      `components/schemas` entry.
    - Handlers that return an untyped `dict` (the response body is assembled in the service
      layer) are described as an open object with a prose `description` pointing at the module
      `contracts.md` that documents the real shape. These are marked by an
      `additionalProperties: true` schema with no enumerated properties.
    - `WingConfiguration` and `AirplaneConfiguration` are deliberately **not** expanded
      field-by-field: their shape is owned by the frozen `cad_designer` topology (ADR 0002) and
      round-trips through `GeneralJSONEncoder`/`Decoder`. See
      `_reversa_sdd/cad-designer-topology/contracts.md`.

    ## Base path — there is none

    Every router is mounted at the application **root**. `/aeroplanes/...`, `/airfoils/...`,
    `/components/...` and the rest carry **no** `/api/v2` segment. The single exception is the
    OpenVSP importer, which is mounted with `prefix="/api/v2"` and therefore answers at
    `/api/v2/import/openvsp`. This inconsistency is real, not a documentation artefact.

    ## Identifiers

    `{aeroplane_id}` is the **public UUID** everywhere — except in the `versioning` tag, whose
    routes address nodes by their **integer primary key** (`{aeroplane_id}`, `{snapshot_id}`,
    `{branch_id}`, `{root_id}`). Mixing the two is the most common integration error.

    Route registration order is load-bearing: the versioning router is included **before** the
    aeroplane router so that the static path `/aeroplanes/compare` matches ahead of
    `/aeroplanes/{aeroplane_id}` (gh-914).

    ## Units — read this before sending a payload

    | Context | Unit |
    |---|---|
    | Wing `xyz_le`, `chord`, `xyz_ref`, weight-item positions | metres |
    | `twist`, `dihedral`, control-surface deflections | degrees |
    | `OperatingPoint.alpha` / `.beta` (request schema) | **degrees** |
    | `StoredOperatingPoint.alpha` / `.beta` (persisted schema) | **radians** |
    | Spar dimensional fields on the wire | metres |
    | Spar dimensional fields in storage (`wing_xsec_spares`) | **millimetres** (gh-402) |
    | `spare_vector` | dimensionless unit vector — never scaled |
    | `WingConfiguration` / `AirplaneConfiguration` payloads | **millimetres** |
    | Turbulator `height_mm` | millimetres; `position_root`/`position_tip` are x/c fractions |
    | Component-tree weights, component `mass_g` | grams |
    | `total_mass_kg`, weight-item `mass_kg` | kilograms |
    | Component-tree positions, bounding boxes, `volume_mm3`, `area_mm2` | mm / mm³ / mm² |

    ## The document is not a constant

    `cadquery` and `aerosandbox` are excluded by environment marker on some platforms
    (ADR 0017). Where they cannot be imported, the `cad`, `aeroanalysis`, `operating_points`,
    `airfoils` and `section_aoa` routers are **not registered at all** — their paths return
    **404**, not 503. Endpoints that *are* registered but need a capability declare
    `Depends(require_cad)` / `Depends(require_aerosandbox)` and return a clean **503**.
    The served `/openapi.json` therefore describes the surface of the process that served it;
    this file describes the **full** surface.

    ## Security

    There is **no application-level authentication** (ADR 0016) — the deployment tunnel is the
    security boundary. CORS is `allow_origins=["*"]` with `allow_credentials=True`, and the
    `/static`, `/assets` and `/mcp` mounts are unauthenticated. No security scheme is declared
    here because none exists in the code.

    ## Not described here

    The **MCP tool surface** (76 tools at `/mcp`) is a separate protocol that re-enters these
    same handler functions in-process. See `_reversa_sdd/mcp-server/contracts.md`.
servers:
- url: http://localhost:8001
  description: Local development (uvicorn --port 8001).
- url: http://localhost:8086
  description: docker compose.
tags:
- name: platform-core
  description: 'Cross-cutting frame: app lifespan, health, error envelope, transaction boundary. Publishes
    only /health as a domain route.'
- name: aeroplane-core
  description: 'Aeroplane aggregate root: CRUD, total mass, airplane-configuration export, component tree.'
- name: wing-design
  description: Wings, cross-sections, spars, trailing-edge devices, servos, turbulators, section geometry.
- name: fuselage-design
  description: Fuselages, superellipse cross-sections, STEP slicing and STEP/solid-STEP download.
- name: airfoil-catalog
  description: Airfoil library, coordinates, geometry stats, NeuralFoil analysis, low-Re suitability scoring.
- name: cad-generation
  description: 'CadQuery orchestration: wing loft export tasks, tessellation, artifact zips.'
- name: cad-designer-topology
  description: Frozen CadQuery topology library (ADR 0002). Read-only; publishes NO REST routes of its
    own — reached through cad-generation and construction-plans.
- name: aero-analysis
  description: Operating points and sets, trim, VLM/AeroBuildup solves, stability, strip forces, spanwise
    loads, speed polar, flight envelope.
- name: avl-integration
  description: AVL geometry files, AVL-backed trim and strip forces.
- name: mass-and-balance
  description: Components and component types, weight items, loading scenarios, CG envelope, mass/CG metrics,
    forward CG.
- name: powertrain
  description: Motor/ESC/battery/propeller sizing, powertrain performance, solution space, electric endurance.
- name: mission-and-sizing
  description: Mission objectives, presets and KPIs, design assumptions and recompute, matching chart,
    tail sizing, static-margin sizing, field lengths, flight profiles.
- name: construction-plans
  description: Construction plans, templates, parts, plan execution and build artifacts, spar plans.
- name: versioning
  description: Snapshots, branches, adopt/restore, lineage tree, node compare, lightweight design versions.
- name: openvsp-import
  description: 'OpenVSP .vsp3 import pipeline (ADR 0018: RC-scaling inspiration scope).'
- name: ai-copilot
  description: 'In-app AI copilot: SSE turn stream and conversation history (ADR 0007: copilot proposes,
    human adopts).'
- name: mcp-server
  description: FastMCP tool surface — 76 tools mounted at /mcp, delegating in-process to these same v2
    handlers. Not part of this REST document; see _reversa_sdd/mcp-server/contracts.md.
- name: frontend-workbench
  description: Next.js workbench — the primary consumer of this API. Publishes no backend routes; listed
    so the tag set matches the 18 Reversa modules.
paths:
  /aeroplanes:
    get:
      tags:
      - aeroplane-core
      operationId: get_aeroplanes
      summary: Returns a list of all aeroplanes names with ids alphabetically sorted by the name
      parameters:
      - name: heads_only
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: When True (default), only branch-head aeroplane nodes are returned (hides immutable
          snapshots). Set to False to include all rows.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Entity not found (`code: not_found`).'
        '422':
          description: 'Validation failed (`code: validation_error`), or FastAPI request validation.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/HTTPValidationError'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Internal error (`code: internal_error` / `service_error`).'
    post:
      tags:
      - aeroplane-core
      operationId: create_aeroplane
      summary: Create a new aeroplane instance and returns its ID
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
        description: The aeroplanes name.
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAeroplaneResponse'
        '422':
          description: 'Validation failed (`code: validation_error`), or FastAPI request validation.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/HTTPValidationError'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Internal error (`code: internal_error` / `service_error`).'
  /aeroplanes/compare:
    get:
      tags:
      - versioning
      operationId: compare_aeroplane_nodes
      summary: Return the metrics payloads for two aeroplane nodes side by side
      parameters:
      - name: a
        in: query
        required: true
        schema:
          type: integer
        description: Integer PK of the first aeroplane node
      - name: b
        in: query
        required: true
        schema:
          type: integer
        description: Integer PK of the second aeroplane node
      responses:
        '200':
