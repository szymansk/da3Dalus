          description: 'Internal error (`code: internal_error` / `service_error`).'
components:
  schemas:
    ErrorEnvelope:
      type: object
      description: 'Uniform error body produced by `_raise_http_from_domain` (app/api/v2/endpoints/aeroplane/base.py).
        Domain exceptions map as: NotFoundError -> 404 not_found, ValidationError -> 422 validation_error,
        ConflictError -> 409 conflict, InternalError -> 500 internal_error, bare ServiceException -> 500
        service_error.'
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              enum:
              - not_found
              - validation_error
              - conflict
              - internal_error
              - service_error
            message:
              type: string
            details:
              oneOf:
              - type: object
                properties: {}
                additionalProperties: true
              - type: 'null'
          required:
          - code
          - message
      required:
      - error
    HTTPValidationError:
      type: object
      description: 'FastAPI request-validation error. NOTE: the global RequestValidationError handler
        emits the German message ''Ungültige Eingabedaten'' in an otherwise English API (known divergence).'
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  anyOf:
                  - type: string
                  - type: integer
              msg:
                type: string
              type:
                type: string
    OperationStatusResponse:
      type: object
      properties:
        status:
          type: string
        operation:
          type: string
      required:
      - status
      - operation
    CreateAeroplaneResponse:
      type: object
      properties:
        id:
          type: string
          description: Public UUID of the new aeroplane.
      required:
      - id
    StaticUrlResponse:
      type: object
      properties:
        url:
          type: string
      required:
      - url
    ZipAssetResponse:
      type: object
      properties:
        url:
          type: string
        filename:
          type: string
        mime_type:
          type: string
      required:
      - url
      - filename
      - mime_type
    CadTaskAcceptedResponse:
      type: object
      properties:
        aeroplane_id:
          type: string
        href:
          type: string
      required:
      - aeroplane_id
      - href
    CadTaskStatusResponse:
      type: object
      properties:
        aeroplane_id:
          type: string
        href:
          type: string
        status:
          type: string
        message:
          oneOf:
          - type: string
          - type: 'null'
        result:
          oneOf:
          - type: object
            properties: {}
            additionalProperties: true
          - type: 'null'
      required:
      - aeroplane_id
      - href
      - status
    WingUnits:
      type: object
      description: 'Self-describing unit block on every wing. KNOWN GAP: it cannot express the millimetre
        storage exception for `wing_xsec_spares` (gh-402) — spar fields are metres on the wire but millimetres
        in the database.'
      properties:
        geometry_length:
          type: string
          enum:
          - m
          default: m
        detail_length:
          type: string
          enum:
          - m
          default: m
        angle:
          type: string
          enum:
          - deg
          default: deg
    ControlSurface:
      type: object
      description: ASB-compatible projection of the trailing-edge device.
      properties:
        name:
          type: string
        hinge_point:
          type: number
          default: 0.8
          description: Hinge location as a fraction of chord.
        symmetric:
          type: boolean
          default: true
        deflection:
          type: number
          default: 0.0
          description: Deflection in degrees.
      required:
      - name
    ControlSurfaceCadDetails:
      type: object
      description: CAD-only subset of the control surface. All lengths in millimetres.
      properties:
        rel_chord_tip:
          oneOf:
          - type: number
          - type: 'null'
        hinge_spacing:
          oneOf:
          - type: number
            description: Millimetres.
          - type: 'null'
        side_spacing_root:
          oneOf:
          - type: number
            description: Millimetres.
          - type: 'null'
        side_spacing_tip:
          oneOf:
          - type: number
            description: Millimetres.
          - type: 'null'
        servo_placement:
          oneOf:
          - type: string
            enum:
            - top
            - bottom
          - type: 'null'
        rel_chord_servo_position:
          oneOf:
          - type: number
          - type: 'null'
        rel_length_servo_position:
          oneOf:
          - type: number
          - type: 'null'
        positive_deflection_deg:
          oneOf:
          - type: number
          - type: 'null'
        negative_deflection_deg:
          oneOf:
          - type: number
          - type: 'null'
        trailing_edge_offset_factor:
          oneOf:
          - type: number
          - type: 'null'
        hinge_type:
          oneOf:
          - $ref: '#/components/schemas/HingeType'
          - type: 'null'
    HingeType:
      type: string
      enum:
      - middle
      - top
      - top_simple
      - round_inside
      - round_outside
    ControlSurfaceRole:
      type: string
      enum:
      - elevator
      - aileron
      - rudder
      - elevon
      - flaperon
      - ruddervator
      - stabilator
      - flap
      - other
    Servo:
      type: object
      description: Servo geometry block (app/schemas/Servo.py). All dimensions in millimetres. May also
        be supplied as a bare integer index into the servo catalogue.
      properties: {}
      additionalProperties: true
    TrailingEdgeDevice:
      type: object
      description: 'Full trailing-edge device definition for the segment anchored at this cross-section.
        Segment-scoped: forbidden on the terminal station (422).'
      properties:
        name:
          oneOf:
          - type: string
          - type: 'null'
        role:
          $ref: '#/components/schemas/ControlSurfaceRole'
        label:
          oneOf:
          - type: string
          - type: 'null'
        rel_chord_root:
          oneOf:
          - type: number
            description: Root hinge position as relative chord (0..1).
          - type: 'null'
        rel_chord_tip:
          oneOf:
          - type: number
          - type: 'null'
        hinge_spacing:
          oneOf:
          - type: number
            description: Millimetres.
          - type: 'null'
        side_spacing_root:
          oneOf:
          - type: number
            description: Millimetres.
          - type: 'null'
        side_spacing_tip:
          oneOf:
          - type: number
            description: Millimetres.
          - type: 'null'
        servo:
          oneOf:
          - oneOf:
            - $ref: '#/components/schemas/Servo'
            - type: integer
          - type: 'null'
        servo_placement:
          type: string
          enum:
          - top
          - bottom
          default: top
        rel_chord_servo_position:
          oneOf:
          - type: number
          - type: 'null'
        rel_length_servo_position:
          oneOf:
          - type: number
          - type: 'null'
        positive_deflection_deg:
          oneOf:
          - type: number
          - type: 'null'
        negative_deflection_deg:
          oneOf:
          - type: number
          - type: 'null'
        deflection_deg:
          type: number
          default: 0.0
        trailing_edge_offset_factor:
          oneOf:
          - type: number
          - type: 'null'
        hinge_type:
          oneOf:
          - $ref: '#/components/schemas/HingeType'
          - type: 'null'
        symmetric:
          oneOf:
          - type: boolean
          - type: 'null'
        mix_gain_primary:
          type: number
          exclusiveMinimum: 0.0
          maximum: 5.0
          default: 1.0
          description: 'gh-772: AVL gain on the PRIMARY (symmetric: pitch/lift) control axis.'
        mix_gain_secondary:
          type: number
          exclusiveMinimum: 0.0
          maximum: 5.0
          default: 1.0
          description: 'gh-772: gain on the SECONDARY (antisymmetric) axis. May differ from 1.0 only for
            roles elevon, flaperon, ruddervator — otherwise 422.'
        differential_ratio:
          type: number
          exclusiveMinimum: 0.3
          maximum: 3.0
          default: 1.0
          description: 'gh-772: up/down throw ratio, reporting-only kinematic applied AFTER trim. May
            differ from 1.0 only for roles aileron, elevon, flaperon, ruddervator — otherwise 422.'
    Turbulator:
      type: object
      description: 'gh-934 per-segment upper-surface turbulator strip. Segment-scoped: forbidden on the
        terminal station (422).'
      properties:
        form:
          type: string
          enum:
          - zigzag
          - dots
          - thread
          default: zigzag
        height_mm:
          type: number
          minimum: 0.0
          default: 0.3
          description: Strip height in millimetres.
        position_root:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Chordwise x/c at the segment root.
        position_tip:
          oneOf:
          - type: number
            minimum: 0.0
            maximum: 1.0
          - type: 'null'
        enabled:
          type: boolean
          default: true
      required:
      - position_root
    Spare:
      type: object
      description: 'Spar (`Spare`) attached to the segment anchored at this cross-section. Unit boundary:
        the service layer converts wire metres to stored millimetres via `_convert_spare_to_mm` / `_convert_spare_to_meters`
        (gh-402). `spare_vector` is dimensionless and never scaled.'
      properties:
        spare_support_dimension_width:
          type: number
          description: 'Spar support width. WIRE: metres. STORAGE: millimetres (gh-402).'
        spare_support_dimension_height:
          type: number
          description: 'Spar support height. WIRE: metres. STORAGE: millimetres (gh-402).'
        spare_position_factor:
          oneOf:
          - type: number
            description: Relative chordwise position (0..1).
          - type: 'null'
        spare_length:
          oneOf:
          - type: number
            description: 'WIRE: metres. STORAGE: millimetres.'
          - type: 'null'
        spare_start:
          type: number
          default: 0.0
          description: 'WIRE: metres. STORAGE: millimetres.'
        spare_mode:
          oneOf:
          - type: string
            enum:
            - normal
            - follow
            - standard
            - standard_backward
            - orthogonal_backward
            default: standard
          - type: 'null'
        spare_vector:
          oneOf:
          - type: array
            items:
              type: number
            minItems: 3
            maxItems: 3
            description: Unit direction vector — DIMENSIONLESS, never scaled.
          - type: 'null'
        spare_origin:
          oneOf:
          - type: array
            items:
              type: number
            minItems: 3
            maxItems: 3
            description: 'Spar origin. WIRE: metres. STORAGE: millimetres.'
          - type: 'null'
      required:
      - spare_support_dimension_width
      - spare_support_dimension_height
    WingXSec:
      type: object
      description: One wing station. The six segment-scoped fields (`spare_list`, `trailing_edge_device`,
        `turbulator`, `x_sec_type`, `tip_type`, `number_interpolation_points`) describe the OUTGOING segment
        and are rejected with 422 on the LAST station (BR-5, enforced at schema, model and service layers).
      properties:
        xyz_le:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Leading-edge point in metres.
        chord:
          type: number
          description: Chord length in metres.
        twist:
          type: number
          description: Twist in degrees.
        dihedral:
          oneOf:
          - type: number
            description: Local-x rotation in degrees; null means derive from geometry (gh-951).
          - type: 'null'
        airfoil:
          type: string
          description: Airfoil .dat path or URL.
        control_surface:
          oneOf:
          - $ref: '#/components/schemas/ControlSurface'
          - type: 'null'
        x_sec_type:
          oneOf:
          - type: string
            enum:
            - root
            - segment
            - tip
          - type: 'null'
        tip_type:
          oneOf:
          - type: string
            enum:
            - flat
            - round
          - type: 'null'
        number_interpolation_points:
          oneOf:
          - type: integer
          - type: 'null'
        spare_list:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/Spare'
          - type: 'null'
        trailing_edge_device:
          oneOf:
          - $ref: '#/components/schemas/TrailingEdgeDevice'
          - type: 'null'
        turbulator:
          oneOf:
          - $ref: '#/components/schemas/Turbulator'
          - type: 'null'
      required:
      - xyz_le
      - chord
      - twist
      - airfoil
    Wing:
      type: object
      description: AeroSandbox-shaped wing. Geometry in METRES. At least two stations.
      properties:
        name:
          type: string
        symmetric:
          type: boolean
          default: true
        design_model:
          oneOf:
          - type: string
            enum:
            - wc
            - asb
            description: Stamped 'asb' on the ASB-geometry create path, 'wc' on the WingConfiguration
              path, null for legacy rows.
          - type: 'null'
        x_secs:
          type: array
          items:
            $ref: '#/components/schemas/WingXSec'
          minItems: 2
        units:
          $ref: '#/components/schemas/WingUnits'
      required:
      - name
      - x_secs
    WingConfiguration:
      type: object
      description: cad_designer `WingConfiguration` payload — the MILLIMETRE world (ADR 0001). Polymorphic,
        round-tripped through GeneralJSONEncoder/Decoder, whose exact shape is owned by the frozen cad_designer
        topology (ADR 0002). Represented here as a free-form object rather than being duplicated field-by-field;
        see _reversa_sdd/cad-designer-topology/contracts.md for the authoritative structure.
      properties: {}
      additionalProperties: true
    FuselageXSec:
      type: object
      description: Superellipse fuselage station. Simplified model used for drag and layout; the STEP
        file is the precise geometry.
      properties:
        xyz:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Cross-section centre in metres.
        a:
          type: number
          description: Y half-axis (semi-width) in metres. Maps to ASB FuselageXSec.width.
        b:
          type: number
          description: Z half-axis (semi-height) in metres. Maps to ASB FuselageXSec.height.
        n:
          type: number
          description: Superellipse exponent (2 = ellipse).
      required:
      - xyz
      - a
      - b
      - n
    Fuselage:
      type: object
      properties:
        name:
          type: string
        x_secs:
          type: array
          items:
            $ref: '#/components/schemas/FuselageXSec'
          minItems: 2
        symmetric:
          type: boolean
          default: false
          description: When true the fuselage is mirrored about the XZ plane on the fly.
        step_path:
          oneOf:
          - type: string
            description: Relative path under ARTIFACTS_BASE_DIR to the per-geom STEP exported at OpenVSP-import
              time (gh-729).
          - type: 'null'
        solid_step_path:
          oneOf:
          - type: string
            description: Relative path to the sewed/healed closed-Solid STEP (gh-731).
          - type: 'null'
      required:
      - name
      - x_secs
    Aeroplane:
      type: object
      properties:
        name:
          type: string
        total_mass_kg:
          oneOf:
          - type: number
            description: Kilograms.
          - type: 'null'
        wings:
          type: object
          description: 'Ordered map wing name -> wing. NOTE: the first entry is NOT necessarily the main
            wing; the main wing is the largest planform area (gh-788).'
          properties: {}
          additionalProperties:
            $ref: '#/components/schemas/Wing'
        fuselages:
          oneOf:
          - type: object
            properties: {}
            additionalProperties:
              $ref: '#/components/schemas/Fuselage'
          - type: 'null'
        xyz_ref:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Reference point (e.g. CG) in metres.
      required:
      - name
    AeroplaneMass:
      type: object
      properties:
        total_mass_kg:
          type: number
          description: Kilograms.
      required:
      - total_mass_kg
    AirplaneConfiguration:
      type: object
      description: cad_designer AirplaneConfiguration payload — MILLIMETRE world. 422 when total_mass_kg
        is null.
      properties:
        name:
          type: string
        total_mass_kg:
          type: number
        wings:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
        fuselages:
          oneOf:
          - type: array
            items:
              type: object
              properties: {}
              additionalProperties: true
          - type: 'null'
      required:
      - name
      - total_mass_kg
      - wings
    ComponentTreeNodeWrite:
      type: object
      properties:
        parent_id:
          oneOf:
          - type: integer
          - type: 'null'
        sort_index:
          type: integer
          default: 0
        node_type:
          type: string
          enum:
          - group
          - cad_shape
          - cots
        name:
          type: string
          minLength: 1
        shape_key:
          oneOf:
          - type: string
          - type: 'null'
        shape_hash:
          oneOf:
          - type: string
          - type: 'null'
        volume_mm3:
          oneOf:
          - type: number
            minimum: 0
          - type: 'null'
        area_mm2:
          oneOf:
          - type: number
            minimum: 0
          - type: 'null'
        component_id:
          oneOf:
          - type: integer
          - type: 'null'
        quantity:
          type: integer
          minimum: 1
          default: 1
        construction_part_id:
          oneOf:
          - type: integer
          - type: 'null'
        pos_x:
          type: number
          default: 0
          description: Millimetres.
        pos_y:
          type: number
          default: 0
          description: Millimetres.
        pos_z:
          type: number
          default: 0
          description: Millimetres.
        rot_x:
          type: number
          default: 0
          description: Degrees.
        rot_y:
          type: number
          default: 0
          description: Degrees.
        rot_z:
          type: number
          default: 0
          description: Degrees.
        material_id:
          oneOf:
          - type: integer
          - type: 'null'
        weight_override_g:
          oneOf:
          - type: number
            minimum: 0
            description: GRAMS. Highest precedence in the weight chain.
          - type: 'null'
        print_type:
          oneOf:
          - type: string
            enum:
            - volume
            - surface
          - type: 'null'
        scale_factor:
          type: number
          exclusiveMinimum: 0
          default: 1.0
      required:
      - node_type
      - name
    ComponentTreeNode:
      allOf:
      - $ref: '#/components/schemas/ComponentTreeNodeWrite'
      - type: object
        properties:
          id:
            type: integer
          aeroplane_id:
            type: string
          synced_from:
            oneOf:
            - type: string
              description: '''wing:<name>'' / ''fuselage:<name>'' for auto-synced groups.'
            - type: 'null'
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
          own_weight_g:
            oneOf:
            - type: number
              description: 'GRAMS. Precedence: override -> cots -> calculated -> none.'
            - type: 'null'
          own_weight_source:
            type: string
            enum:
            - override
            - cots
            - calculated
            - none
          total_weight_g:
            type: number
            description: Own weight plus every descendant (post-order).
          weight_status:
            type: string
            enum:
            - valid
            - partial
            - invalid
          children:
            type: array
            items:
              $ref: '#/components/schemas/ComponentTreeNode'
    ComponentTreeResponse:
      type: object
      properties:
        aeroplane_id:
          type: string
        root_nodes:
          type: array
          items:
            $ref: '#/components/schemas/ComponentTreeNode'
        total_nodes:
          type: integer
      required:
      - aeroplane_id
    MoveNodeRequest:
      type: object
      properties:
        new_parent_id:
          oneOf:
          - type: integer
          - type: 'null'
        sort_index:
          type: integer
          default: 0
    NodeWeightResponse:
      type: object
      properties:
        node_id:
          type: integer
        name:
          type: string
        own_weight_g:
          oneOf:
          - type: number
          - type: 'null'
        children_weight_g:
          type: number
        total_weight_g:
          type: number
        source:
          type: string
          enum:
          - override
          - cots
          - calculated
          - none
    ComponentWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        component_type:
          type: string
          minLength: 1
          description: Type name — see GET /component-types.
        manufacturer:
          oneOf:
          - type: string
          - type: 'null'
        description:
          oneOf:
          - type: string
          - type: 'null'
        mass_g:
          oneOf:
          - type: number
            minimum: 0
            description: GRAMS.
          - type: 'null'
        bbox_x_mm:
          oneOf:
          - type: number
            minimum: 0
          - type: 'null'
        bbox_y_mm:
          oneOf:
          - type: number
            minimum: 0
          - type: 'null'
        bbox_z_mm:
          oneOf:
          - type: number
            minimum: 0
          - type: 'null'
        model_ref:
          oneOf:
          - type: string
          - type: 'null'
        specs:
          type: object
          description: Type-specific specs, validated against the component type's JSON schema (ADR 0013).
          properties: {}
          additionalProperties: true
      required:
      - name
      - component_type
    Component:
      allOf:
      - $ref: '#/components/schemas/ComponentWrite'
      - type: object
        properties:
          id:
            type: integer
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
          has_polar:
            type: boolean
          polar_id:
            oneOf:
            - type: integer
            - type: 'null'
    ComponentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Component'
        total:
          type: integer
    ComponentTypeWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        schema:
          type: object
          description: 'JSON-schema for this type''s `specs`. NOTE: the DB column is named `schema`, not
            `schema_def`.'
          properties: {}
          additionalProperties: true
      required:
      - name
      additionalProperties: true
    WeightItemWrite:
      type: object
      description: Positions in METRES, mass in KILOGRAMS.
      properties:
        name:
          type: string
          minLength: 1
        mass_kg:
          type: number
          minimum: 0
        x_m:
          type: number
          default: 0.0
        y_m:
          type: number
          default: 0.0
        z_m:
          type: number
          default: 0.0
        description:
          oneOf:
          - type: string
          - type: 'null'
        category:
          type: string
          enum:
          - electronics
          - battery
          - structural
          - payload
          - other
          default: other
      required:
      - name
      - mass_kg
    WeightItem:
      allOf:
      - $ref: '#/components/schemas/WeightItemWrite'
      - type: object
        properties:
          id:
            type: integer
        required:
        - id
    WeightSummary:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeightItem'
        total_mass_kg:
          type: number
        cg_x_m:
          oneOf:
          - type: number
          - type: 'null'
        cg_y_m:
          oneOf:
          - type: number
          - type: 'null'
        cg_z_m:
          oneOf:
          - type: number
          - type: 'null'
    LoadingScenario:
      type: object
      description: A named mass-loading case used to build the CG envelope (app/schemas/loading_scenario.py).
      properties: {}
      additionalProperties: true
    CgEnvelope:
      type: object
      description: 'Forward/aft CG limits derived from the loading scenarios. ADR 0011: CG is a top-down
        design target from stability, not a bottom-up sum.'
      properties: {}
      additionalProperties: true
    ForwardCGResult:
      type: object
      description: Forward-CG limit from elevator authority. `solver=asb` uses AeroBuildup; `solver=avl`
        is the higher-fidelity opt-in for V-tail / elevon / flaperon layouts.
      properties: {}
      additionalProperties: true
    OperatingPoint:
      type: object
      description: Request-side flight condition. Angles in DEGREES.
      properties:
        name:
          oneOf:
          - type: string
          - type: 'null'
        description:
          oneOf:
          - type: string
          - type: 'null'
        velocity:
          type: number
          default: 10.0
          description: TAS in m/s.
        alpha:
          oneOf:
          - type: number
          - type: array
            items:
              type: number
          default: 0.0
          description: Angle of attack in DEGREES (contrast StoredOperatingPoint, which is radians).
        beta:
          type: number
          default: 0.0
          description: Sideslip in DEGREES.
        p:
          type: number
          default: 0.0
          description: Roll rate, rad/s.
        q:
          type: number
          default: 0.0
          description: Pitch rate, rad/s.
        r:
          type: number
          default: 0.0
          description: Yaw rate, rad/s.
        xyz_ref:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Moment reference point in metres.
      additionalProperties: true
    OperatingPointStatus:
      type: string
      enum:
      - TRIMMED
      - NOT_TRIMMED
      - LIMIT_REACHED
      - DIRTY
      - COMPUTING
      - INVALID
      description: INVALID means the persisted row itself is broken and cannot be recovered by retrying
        the trim (gh-623).
    StoredOperatingPointCreate:
      type: object
      description: Persisted operating point. Angles in RADIANS.
      properties:
        name:
          type: string
        description:
          type: string
        aircraft_id:
          oneOf:
          - type: integer
          - type: 'null'
        config:
          type: string
          default: clean
        status:
          $ref: '#/components/schemas/OperatingPointStatus'
        warnings:
          type: array
          items:
            type: string
        controls:
          type: object
          properties: {}
          additionalProperties:
            type: number
        velocity:
          type: number
          description: m/s.
        alpha:
          type: number
          description: Angle of attack in RADIANS (contrast OperatingPoint, which is degrees).
        beta:
          type: number
          description: Sideslip in RADIANS.
        p:
          type: number
        q:
          type: number
        r:
          type: number
        xyz_ref:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Metres.
        altitude:
          type: number
          description: Metres.
        control_deflections:
          oneOf:
          - type: object
            description: Control-surface name -> degrees. Overrides geometry defaults for this operating
              point.
            properties: {}
            additionalProperties:
              type: number
          - type: 'null'
        trim_enrichment:
          oneOf:
          - $ref: '#/components/schemas/TrimEnrichment'
          - type: 'null'
      required:
      - name
      - description
      - velocity
      - alpha
      - beta
      - p
      - q
      - r
      - altitude
    StoredOperatingPoint:
      allOf:
      - $ref: '#/components/schemas/StoredOperatingPointCreate'
      - type: object
        properties:
          id:
            type: integer
        required:
        - id
    OperatingPointDeflectionPatch:
      type: object
      properties:
        control_deflections:
          oneOf:
          - type: object
            properties: {}
            additionalProperties:
              type: number
          - type: 'null'
      required:
      - control_deflections
    OperatingPointSet:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        operating_points:
          type: array
          items:
            type: integer
      required:
      - name
      - description
      - operating_points
    TrimEnrichment:
      type: object
      properties:
        analysis_goal:
          type: string
        trim_method:
          type: string
          description: opti | grid_search | avl | aerobuildup.
        trim_score:
          oneOf:
          - type: number
          - type: 'null'
        trim_residuals:
          type: object
          properties: {}
          additionalProperties:
            type: number
        deflection_reserves:
          type: object
          properties: {}
          additionalProperties: true
        design_warnings:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
        effectiveness:
          type: object
          properties: {}
          additionalProperties: true
        stability_classification:
          oneOf:
          - type: object
            properties: {}
            additionalProperties: true
          - type: 'null'
        mixer_values:
          type: object
          description: Dual-role surface decomposition.
          properties: {}
          additionalProperties: true
        result_summary:
          type: string
        aero_coefficients:
          type: object
          properties: {}
          additionalProperties:
            type: number
      required:
      - analysis_goal
      - trim_method
    AnalysisStatusResponse:
      type: object
      properties:
        op_counts:
          type: object
          properties: {}
          additionalProperties:
            type: integer
        total_ops:
          type: integer
        retrim_active:
          type: boolean
        retrim_debouncing:
          type: boolean
        last_computation:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
    AlphaSweepRequest:
      type: object
      properties:
        alpha_start:
          type: number
          default: -15
          description: Degrees.
        alpha_end:
          type: number
          default: 20
          description: Degrees.
      additionalProperties: true
    SimpleSweepRequest:
      type: object
      description: Sweep definition plus flight conditions.
      properties: {}
      additionalProperties: true
    AVLTrimRequest:
      type: object
      properties:
        operating_point:
          $ref: '#/components/schemas/OperatingPoint'
        trim_constraints:
          type: array
          items:
            $ref: '#/components/schemas/TrimConstraint'
          minItems: 1
      required:
      - operating_point
      - trim_constraints
    TrimConstraint:
      type: object
      properties:
        variable:
          type: string
          description: alpha | beta | roll_rate | pitch_rate | yaw_rate | a control-surface name.
        target:
          type: string
          enum:
          - C
          - S
          - PM
          - RM
          - YM
          description: CL | CY | pitching | rolling | yawing moment.
        value:
          type: number
          default: 0.0
      required:
      - variable
      - target
    AeroBuildupTrimRequest:
      type: object
      properties:
        operating_point:
          $ref: '#/components/schemas/OperatingPoint'
        trim_variable:
          type: string
          default: elevator
        target_coefficient:
          type: string
          default: Cm
          enum:
          - CL
          - CD
          - CY
          - Cm
          - Cl
          - Cn
        target_value:
          type: number
          default: 0.0
        deflection_bounds:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: Degrees [lower, upper]. Default [-25, 25].
      required:
      - operating_point
    AddTurnRequest:
      type: object
      properties:
        bank_angle_deg:
          type: number
          exclusiveMinimum: 0.0
          exclusiveMaximum: 90.0
        velocity:
          oneOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
        altitude:
          oneOf:
          - type: number
            minimum: 0.0
          - type: 'null'
        name:
          oneOf:
          - type: string
          - type: 'null'
      required:
      - bank_angle_deg
    AeroResult:
      type: object
      description: 'Solver output: aero coefficients, forces and moments, and (for AVL/stability runs)
        stability derivatives. Shape varies by analysis_tool; see _reversa_sdd/aero-analysis/contracts.md.'
      properties: {}
      additionalProperties: true
    StabilitySummary:
      type: object
      description: 'Neutral point, static margin and the derivative set at the cruise point. ADR 0004:
        ONE aero truth per aircraft — every consumer reads the same computation context.'
      properties: {}
      additionalProperties: true
    StripForcesResponse:
      type: object
      description: Per-strip loading. `solver=vlm` runs in-process; `solver=avl` shells out to the vendored
        AVL binary.
      properties: {}
      additionalProperties: true
    SpanwiseLoadsResponse:
      type: object
      description: Spanwise lift and bending-moment distribution.
      properties: {}
      additionalProperties: true
    SpanwiseLoadsWithSizingResponse:
      type: object
      description: Spanwise loads plus the derived spar sizing for the requested material and cross-section
        shape.
      properties: {}
      additionalProperties: true
    SectionGeometryResponse:
      type: object
      description: Per-section geometry (chord, thickness, max-thickness location) used by spar placement.
      properties: {}
      additionalProperties: true
    SectionAoaResponse:
      type: object
      description: Per-section angle of attack. Returns HALF-SPAN sections only.
      properties: {}
      additionalProperties: true
    SpeedPolarResponse:
      type: object
      description: Sink rate vs airspeed, with V_md (best glide) and V_min_sink.
      properties: {}
      additionalProperties: true
    FlightEnvelopeResponse:
      type: object
      description: V-n diagram / flight envelope.
      properties: {}
      additionalProperties: true
    SparPlanRequest:
      type: object
      properties:
        material_id:
          type: integer
          description: Component with component_type='material' and allowable_bending_stress_mpa set.
        moments:
          type: array
          items:
            $ref: '#/components/schemas/MomentSample'
          minItems: 1
        wing_name:
          oneOf:
          - type: string
            description: Defaults to the aeroplane's MAIN wing (gh-1092), not surfaces[0].
          - type: 'null'
        front_x_over_chord:
          oneOf:
          - type: number
            exclusiveMinimum: 0.0
            exclusiveMaximum: 1.0
          - type: 'null'
        rear_x_over_chord:
          type: number
          exclusiveMinimum: 0.0
          exclusiveMaximum: 1.0
          default: 0.65
        n_span:
          type: integer
          minimum: 2
          maximum: 200
          default: 6
        packing_factor:
          type: number
          exclusiveMinimum: 0.0
          maximum: 1.0
          default: 0.8
        safety_factor_j:
          type: number
          exclusiveMinimum: 0.0
          default: 1.5
        sigma_allow_mpa_override:
          oneOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
        torsion_moments:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/TorsionSample'
          - type: 'null'
        rear_secondary_bending_fraction:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 0.0
        pitching_moment_proxy_ratio:
          type: number
          minimum: 0.0
          default: 0.1
        shape:
          type: string
          enum:
          - tube
          - rod
          - rectangular
          - capped
          default: tube
      required:
      - material_id
      - moments
    MomentSample:
      type: object
      properties:
        y_span:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Span fraction, root=0, tip=1.
        bending_moment_Nm:
          type: number
          description: N·m.
      required:
      - y_span
      - bending_moment_Nm
    TorsionSample:
      type: object
      properties:
        y_span:
          type: number
          minimum: 0.0
          maximum: 1.0
        torsion_moment_Nm:
          type: number
          description: N·m about the front spar line.
      required:
      - y_span
      - torsion_moment_Nm
    SparPiece:
      type: object
      properties:
        role:
          type: string
          enum:
          - front
          - rear
          description: front = bending, rear = torsion.
        spare_origin:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Piece root origin in the wing-local frame, METRES.
        spare_vector:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Unit direction vector, dimensionless.
        outer_d:
          type: number
          description: Outer diameter, metres.
        inner_d:
          type: number
          description: Bore, metres; 0 for a solid rod.
        wall:
          type: number
          description: (outer_d - inner_d)/2, metres.
        shape:
          type: string
        governing_y:
          type: number
          description: Spanwise position of the highest-moment station, metres.
        x_over_chord:
          type: number
          minimum: 0.0
          maximum: 1.0
        y_start:
          type: number
          description: Metres, root = 0.
        y_end:
          type: number
          description: Metres.
      required:
      - role
      - spare_origin
      - spare_vector
      - outer_d
      - inner_d
      - wall
      - shape
    SparPlanResponse:
      type: object
      description: Computed two-spar plan for one wing. Includes `front_no_spar_from_y` / `rear_no_spar_from_y`
        cut-offs where the load becomes negligible (gh-1076).
      properties:
        pieces:
          type: array
          items:
            $ref: '#/components/schemas/SparPiece'
      additionalProperties: true
    SparInsertResponse:
      type: object
      description: Result of materialising a computed spar plan into persisted `Spare` rows on the wing's
        cross-sections.
      properties: {}
      additionalProperties: true
    TurbulatorOptimizeRequest:
      type: object
      properties: {}
      additionalProperties: true
    TurbulatorOptimizeResponse:
      type: object
      description: Per-section `xtr_opt` (on XTR_GRID = linspace(0.2, 0.9, 15)) and `delta_cd = cd_tripped
        - cd_clean`, plus aircraft-level DeltaCD0 and a warnings list. Anomalies (all-NaN cd, mean analysis_confidence
        < 0.80, boundary optimum) are returned as WARNINGS, never substituted by a fallback (ADR 0012).
      properties: {}
      additionalProperties: true
    AvlGeometryUpdateRequest:
      type: object
      description: Hand-edited .avl geometry text to persist for this aeroplane.
      properties: {}
      additionalProperties: true
    AvlGeometryResponse:
      type: object
      description: Persisted .avl geometry file plus its provenance.
      properties: {}
      additionalProperties: true
    Airfoil:
      type: object
      description: 'Airfoil catalogue row: name, family, geometry stats, low-Re polar availability.'
      properties: {}
      additionalProperties: true
    AirfoilCoordinates:
      type: object
      description: Selig-order x/y coordinate pairs.
      properties: {}
      additionalProperties: true
    AirfoilGeometryStats:
      type: object
      description: max_thickness_pct, max_camber_pct and their chordwise locations.
      properties: {}
      additionalProperties: true
    NeuralFoilAnalysisResponse:
      type: object
      description: NeuralFoil cl/cd/cm surrogate output over the requested alpha/Re grid, with `analysis_confidence`.
      properties: {}
      additionalProperties: true
    SuitabilityQuery:
      type: object
      description: Echo of the resolved query. `target_cl_provenance` records whether the CL targets came
        from calculated, estimated or mixed inputs.
      properties:
        chord_m:
          type: number
        speed_ms:
          type: number
        reynolds:
          type: number
        re_clamped:
          type: boolean
        mission_type:
          oneOf:
          - type: string
          - type: 'null'
        target_cl_cruise:
          oneOf:
          - type: number
          - type: 'null'
        target_cl_best_glide:
          oneOf:
          - type: number
          - type: 'null'
        target_cl_min_sink:
          oneOf:
          - type: number
          - type: 'null'
        v_cruise_mps:
          oneOf:
          - type: number
          - type: 'null'
        v_md_mps:
          oneOf:
          - type: number
          - type: 'null'
        v_min_sink_mps:
          oneOf:
          - type: number
          - type: 'null'
      additionalProperties: true
    SuitabilityCaveat:
      type: object
      description: Always present. The score uses section CL as a proxy for whole-wing CL and therefore
        ignores the tip-Re CL_max collapse — use `tip_re_flag` + `cl_max_margin` to surface that risk.
      properties:
        relative_ranking_only:
          type: boolean
          default: true
        no_hysteresis_modelling:
          type: boolean
          default: true
        ignores_tip_re_clmax_collapse:
          type: boolean
          default: true
        recommend_xfoil_validation:
          type: boolean
        text:
          type: string
    SuitabilityItem:
      type: object
      properties:
        airfoil_name:
          type: string
        family:
          type: string
          enum:
          - flat_bottom
          - semi_symmetric
          - symmetric
          - cambered
          - reflexed
        re_agnostic:
          type: number
          minimum: 0.0
          maximum: 1.0
        mission:
          oneOf:
          - type: number
            minimum: 0.0
            maximum: 1.0
          - type: 'null'
        target_cl_cruise:
          oneOf:
          - type: number
            minimum: 0.0
            maximum: 1.0
          - type: 'null'
        target_cl_best_glide:
          oneOf:
          - type: number
            minimum: 0.0
            maximum: 1.0
            description: Display-only; does not drive active_lens.
          - type: 'null'
        target_cl_min_sink:
          oneOf:
          - type: number
            minimum: 0.0
            maximum: 1.0
            description: Display-only. Renamed from target_cl_loiter (gh-825).
          - type: 'null'
        stall_gentleness:
          oneOf:
          - type: number
            description: Raw dCL/dalpha slope past the CL_max peak — NOT normalised. ~0 gentle, negative
              abrupt.
          - type: 'null'
        cl_max_margin:
          oneOf:
          - type: number
            description: cl_max minus the largest target CL. Negative = stall risk.
          - type: 'null'
        tags:
          type: array
          items:
            type: string
            enum:
            - v_stabilizer
            - h_stabilizer
            - acro
            - winglet
            - low_re
            - high_re
      required:
      - airfoil_name
      - family
      - re_agnostic
      additionalProperties: true
    SuitabilityResponse:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/SuitabilityQuery'
        caveat:
          $ref: '#/components/schemas/SuitabilityCaveat'
        results:
          type: array
          items:
            $ref: '#/components/schemas/SuitabilityItem'
      required:
      - query
      - caveat
      - results
    MissionObjective:
      type: object
      properties:
        mission_type:
          type: string
          description: FK to MissionPreset.id.
        target_cruise_mps:
          type: number
          minimum: 0
        target_stall_safety:
          type: number
          minimum: 1.0
          description: V_cruise / V_s1.
        target_maneuver_n:
          type: number
          minimum: 1.0
          description: Load factor [g].
        target_glide_ld:
          type: number
          minimum: 0
        target_climb_energy:
          type: number
          minimum: 0
          description: C_L^1.5 / C_D.
        target_wing_loading_n_m2:
          type: number
          minimum: 0
        target_field_length_m:
          type: number
          minimum: 0
        available_runway_m:
          type: number
          minimum: 0
        runway_type:
          type: string
          enum:
          - grass
          - asphalt
          - belly
        t_static_N:
          type: number
          minimum: 0
          description: Static thrust at V=0, newtons.
        takeoff_mode:
          type: string
          enum:
          - runway
          - hand_launch
          - bungee
          - catapult
        landing_surface:
          oneOf:
          - type: string
            enum:
            - grass_short
            - grass_long
            - hard_paved
            - soft_soil
            - belly_grass
            - net_recovery
          - type: 'null'
        landing_safety_factor:
          oneOf:
          - type: number
            minimum: 1.0
            maximum: 3.0
          - type: 'null'
        available_field_length_m:
          oneOf:
          - type: number
            minimum: 0
          - type: 'null'
      required:
      - mission_type
      - target_cruise_mps
      - target_stall_safety
      - target_maneuver_n
      - target_glide_ld
      - target_climb_energy
      - target_wing_loading_n_m2
      - target_field_length_m
      - available_runway_m
      - runway_type
      - t_static_N
      - takeoff_mode
    MissionPreset:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        target_polygon:
          type: object
          description: Target scores 0..1 for the 7 axes.
          properties: {}
          additionalProperties:
            type: number
        axis_ranges:
          type: object
          properties: {}
          additionalProperties:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
        suggested_estimates:
          type: object
          properties:
            g_limit:
              type: number
            target_static_margin:
              type: number
            cl_max:
              type: number
            power_to_weight:
              type: number
            prop_efficiency:
              type: number
      required:
      - id
      - label
      - description
    MissionKpis:
      type: object
      description: Per-axis achieved vs target scores for the requested missions.
      properties: {}
      additionalProperties: true
    AssumptionWrite:
      type: object
      properties:
        estimate_value:
          type: number
          description: Manual estimate. Infinity/NaN rejected.
      required:
      - estimate_value
    AssumptionSourceSwitch:
      type: object
      properties:
        active_source:
          type: string
          enum:
          - ESTIMATE
          - CALCULATED
      required:
      - active_source
    DesignAssumption:
      type: object
      description: 'ADR 0010: every assumption carries BOTH an estimate and a calculated value; `active_source`
        selects which one is effective.'
      properties:
        id:
          type: integer
        parameter_name:
          type: string
        estimate_value:
          type: number
        calculated_value:
          oneOf:
          - type: number
          - type: 'null'
        calculated_source:
          oneOf:
          - type: string
          - type: 'null'
        active_source:
          type: string
          enum:
          - ESTIMATE
          - CALCULATED
        effective_value:
          type: number
          description: The value actually used for simulations.
        divergence_pct:
          oneOf:
          - type: number
          - type: 'null'
        divergence_level:
          type: string
          enum:
          - none
          - info
          - warning
          - alert
        unit:
          type: string
        is_design_choice:
          type: boolean
          description: True for parameters that are never auto-calculated.
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - parameter_name
      - estimate_value
      - active_source
      - effective_value
      - divergence_level
    AssumptionsSummary:
      type: object
      properties:
        assumptions:
          type: array
          items:
            $ref: '#/components/schemas/DesignAssumption'
        warnings_count:
          type: integer
    ComputationContext:
      type: object
      description: 'ADR 0004: the single source of aero truth — one cd0 (PARASITE, not total CD), one
        e, one L/D, one neutral point, taken from the cruise point. Every consumer reads this; do not
        add a fourth cd0 path.'
      properties: {}
      additionalProperties: true
    ComputationConfig:
      type: object
      description: Per-aircraft solver/computation configuration (aircraft_computation_config table).
      properties: {}
      additionalProperties: true
    RecomputeStatus:
      type: object
      description: Whether a background assumption recompute is queued, running or complete.
      properties: {}
      additionalProperties: true
    MatchingChartResponse:
      type: object
      description: T/W vs W/S constraint diagram. Emits the 5 base constraints plus, when a flight profile
        is active, the RC-additive ones (Mission-Min T/W, WCL, Power-Loading, Vertical-Climb, Hand-Launch),
        each tagged with `applicable_for_profile` (gh-613).
      properties: {}
      additionalProperties: true
    TailSizingResponse:
      type: object
      description: Horizontal and vertical tail volume coefficients and lever arms.
      properties: {}
      additionalProperties: true
    SmSuggestionResponse:
