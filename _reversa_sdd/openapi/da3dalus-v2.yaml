      operationId: import_openvsp
      summary: Import an OpenVSP ``.vsp3`` file as a new aeroplane
      parameters:
      - name: target_span_m
        in: query
        required: false
        schema:
          type: number
        description: 'Optional: rescale the imported aeroplane so the largest wing physical span equals
          this value in metres. Mutually exclusive with scale_factor. Range: (0.1, 50).'
      - name: scale_factor
        in: query
        required: false
        schema:
          type: number
        description: 'Optional: multiply all length-typed fields (positions, chords, fuselage radii, weight-item
          positions) by this factor. Mutually exclusive with target_span_m. Range: (0.001, 10). Masses
          are NOT scaled.'
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: 'Optional: user-supplied aeroplane name. Overrides the default (which is the uploaded
          filename''s stem). Whitespace-only values are treated as ''no override''.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: OpenVSP .vsp3 file
              required:
              - file
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenVspImportResponse'
        '422':
          description: 'Validation failed (`code: validation_error`), or FastAPI request validation.'
