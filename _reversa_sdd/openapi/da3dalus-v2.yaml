          - uav_runway
          - uav_belly_land
          default: rc_runway
        description: 'Aircraft mode: rc_runway | rc_hand_launch | uav_runway | uav_belly_land. Sets default
          field length, climb-gradient, and stall-speed targets.'
      - name: s_runway
        in: query
        required: false
        schema:
          type: number
        description: '[Override] Field length target [m] (to 50 ft for TO; from 50 ft for LDG). Defaults:
          rc_runway=50 m, uav_runway=200 m.'
      - name: v_s_target
        in: query
        required: false
        schema:
          type: number
        description: '[Override] Maximum acceptable stall speed [m/s] (clean). Defaults: rc=7 m/s, uav=12
          m/s.'
      - name: gamma_climb_deg
        in: query
        required: false
        schema:
          type: number
        description: '[Override] Target climb gradient [°]. Defaults: rc=5°, uav=4°.'
      - name: v_cruise_mps
        in: query
        required: false
        schema:
          type: number
        description: '[Override] Cruise speed [m/s] for the cruise constraint. Defaults to v_md_mps from
          assumption context or polar estimate.'
      - name: flight_profile
        in: query
        required: false
        schema:
          type: string
        description: Mission profile id (e.g. trainer, sport, acro_3d, wing_racer, stol_bush, slope_soarer,
          motor_glider, flying_wing, glider/sailplane, custom). When set, the service emits RC-additive
          constraints (Mission-Min T/W, WCL, Power-Loading, Vertical-Climb, Hand-Launch) and tags each
          constraint with applicable_for_profile per the gh-613 Phase B mapping. When omitted, the active
          MissionObjective.mission_type is used (if any); else only the original 5 constraints are emitted
          (back-compat).
